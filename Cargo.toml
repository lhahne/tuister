[package]
name = "tuister"
version = "0.1.0"
edition = "2021"

[lib]
name = "tuister"
path = "src/lib.rs"

[[bin]]
name = "tuister"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
