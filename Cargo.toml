[package]
name = "tuister"
version = "0.1.0"
edition = "2021"

[lib]
name = "tuister"
path = "src/lib.rs"

[[bin]]
name = "tuister"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
unicode-width = "0.2"
pulldown-cmark = "0.12"
dotenvy = "0.15"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
insta = "1.42"
tokio = { version = "1.41", features = ["rt", "macros"] }
